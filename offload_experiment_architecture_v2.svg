 <path d="M260 675H300" class="arr"/><path d="M441 274v42" class="arr"/><path d="M748 464v75" class="arr"/><path d="M1049 464v75" class="arr"/>

 <!-- metrics -->
 <g filter="url(#s)"><rect x="1295" y="132" width="250" height="620" rx="22" fill="#fff" stroke="#f59e0b" stroke-width="2"/></g>
 <rect x="1320" y="156" width="200" height="32" rx="16" fill="#fef3c7"/><text x="1420" y="178" class="tag c" fill="#92400e">MEASUREMENT LAYER</text>
 <text x="1420" y="227" class="h c">Instrumentation</text>
 <path d="M1330 277h28l13-23 18 47 18-31 16 7h88" stroke="#f59e0b" stroke-width="4" fill="none"/>
 <g class="b"><text x="1327" y="344">• GPU allocated / reserved</text><text x="1327" y="378">• GPU device memory</text><text x="1327" y="412">• CPU RSS / system memory</text><text x="1327" y="446">• Phase &amp; step latency</text><text x="1327" y="480">• Transfer time / volume</text><text x="1327" y="514">• Effective bandwidth</text></g>
 <rect x="1323" y="552" width="194" height="60" rx="13" fill="#fff7ed" stroke="#fdba74"/><text x="1420" y="578" class="m c" fill="#c2410c">Feasibility</text><text x="1420" y="599" class="sm c">success / CUDA OOM</text>
 <rect x="1323" y="635" width="194" height="76" rx="13" fill="#111827"/><text x="1420" y="662" class="m c" style="fill:white">Final comparison</text><text x="1420" y="685" class="sm c" style="fill:#cbd5e1">memory ↔ speed</text><text x="1420" y="703" class="sm c" style="fill:#cbd5e1">Pareto frontier</text>
 <path d="M1255 441h40" class="arr"/>

 <!-- bottom matrix -->
 <rect x="55" y="800" width="1490" height="65" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
 <text x="80" y="840" class="m">Compared configurations:</text>
 <rect x="300" y="817" width="200" height="32" rx="16" fill="#dbeafe"/><text x="400" y="838" class="tag c" fill="#1d4ed8">All-GPU baseline</text>
 <rect x="515" y="817" width="230" height="32" rx="16" fill="#ede9fe"/><text x="630" y="838" class="tag c" fill="#6d28d9">Phase-wise offload</text>
 <rect x="760" y="817" width="235" height="32" rx="16" fill="#dcfce7"/><text x="878" y="838" class="tag c" fill="#15803d">Actor retained on GPU</text>
 <rect x="1010" y="817" width="220" height="32" rx="16" fill="#ffedd5"/><text x="1120" y="838" class="tag c" fill="#c2410c">CPU vs GPU AdamW</text>
