<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
 <defs>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#111"/></marker>
  <marker id="blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#147d9b"/></marker>
  <style>
   .title{font:700 31px Arial,sans-serif;fill:#111}.head{font:700 25px Arial,sans-serif;fill:#111}.box{font:600 22px Arial,sans-serif;fill:#111}.sub{font:500 16px Arial,sans-serif;fill:#333}.small{font:600 14px Arial,sans-serif;fill:#475569}.center{text-anchor:middle}.line{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}.bi{stroke:#111;stroke-width:3;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
  </style>
 </defs>
 <rect width="1500" height="900" fill="white"/>
 <text x="45" y="48" class="title">VERL Offloading Experiment: System Overview</text>

 <!-- top controller -->
 <rect x="38" y="76" width="1424" height="144" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="750" y="111" class="head center">VERL Single-Controller GRPO Trainer</text>
 <g>
  <rect x="82" y="133" width="230" height="62" rx="12" fill="#18dd78"/><text x="197" y="171" class="box center">GSM8K Batch</text>
  <rect x="340" y="133" width="230" height="62" rx="12" fill="#18dd78"/><text x="455" y="171" class="box center">Rollout</text>
  <rect x="598" y="133" width="230" height="62" rx="12" fill="#18dd78"/><text x="713" y="161" class="box center">Log-prob</text><text x="713" y="183" class="small center">Actor + Reference</text>
  <rect x="856" y="133" width="230" height="62" rx="12" fill="#18dd78"/><text x="971" y="171" class="box center">GRPO Update</text>
  <rect x="1114" y="133" width="300" height="62" rx="12" fill="#18dd78"/><text x="1264" y="161" class="box center">Experiment Matrix</text><text x="1264" y="183" class="small center">offload on / off</text>
 </g>

 <!-- system boundary -->
 <rect x="38" y="260" width="1424" height="594" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="70" y="296" class="head">VERL Worker System</text>
 <path d="M38 239H1462" stroke="#ff321d" stroke-width="4" stroke-dasharray="18 13"/>

 <!-- model engine -->
 <rect x="78" y="324" width="405" height="368" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="281" y="361" class="head center">Model Engine</text>
 <rect x="112" y="386" width="337" height="76" rx="12" fill="#ffb7b9"/><text x="281" y="417" class="box center">Hugging Face Qwen</text><text x="281" y="442" class="small center">Actor + Reference model</text>
 <rect x="112" y="480" width="337" height="76" rx="12" fill="#ffb7b9"/><text x="281" y="511" class="box center">PyTorch FSDP</text><text x="281" y="536" class="small center">parameter / optimizer sharding</text>
 <rect x="112" y="574" width="337" height="76" rx="12" fill="#ffb7b9"/><text x="281" y="605" class="box center">AdamW Update</text><text x="281" y="630" class="small center">GPU AdamW or CPU AdamW</text>

 <!-- rollout engine -->
 <rect x="1017" y="324" width="405" height="368" fill="#fff" stroke="#111" stroke-width="4"/>
 <text x="1220" y="361" class="head center">Rollout Engine</text>
 <rect x="1051" y="386" width="337" height="76" rx="12" fill="#438fe5"/><text x="1220" y="417" class="box center">vLLM Server</text><text x="1220" y="442" class="small center" style="fill:#102a43">fast response generation</text>
 <rect x="1051" y="480" width="337" height="76" rx="12" fill="#438fe5"/><text x="1220" y="511" class="box center">Actor Weights</text><text x="1220" y="536" class="small center" style="fill:#102a43">synced from HF model</text>
 <rect x="1051" y="574" width="337" height="76" rx="12" fill="#438fe5"/><text x="1220" y="605" class="box center">Generated Responses</text><text x="1220" y="630" class="small center" style="fill:#102a43">returned to VERL trainer</text>

 <!-- center offload manager -->
 <rect x="549" y="342" width="402" height="330" fill="#fff" stroke="#ff321d" stroke-width="4" stroke-dasharray="15 10"/>
 <rect x="578" y="318" width="344" height="54" fill="#ff4d57"/><text x="750" y="353" class="head center" style="fill:white;font-size:22px">Phase-aware Offload Manager</text>
 <rect x="590" y="398" width="320" height="84" rx="12" fill="#b8c1ff"/><text x="750" y="431" class="box center">GPU Resident State</text><text x="750" y="458" class="small center">active phase only / Actor retained</text>
 <rect x="590" y="532" width="320" height="84" rx="12" fill="#c8f7f7"/><text x="750" y="565" class="box center">CPU Offloaded State</text><text x="750" y="592" class="small center">params · optimizer · activations</text>
 <path d="M680 482v50" stroke="#147d9b" stroke-width="4" fill="none" marker-end="url(#blue)"/><text x="642" y="513" class="small center">OFFLOAD</text>
 <path d="M820 532v-50" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="862" y="513" class="small center">RELOAD</text>

 <!-- connections -->
 <path d="M281 220V324" class="line"/>
 <text x="297" y="276" class="small">train / score</text>
 <path d="M1220 220V324" class="line"/>
 <text x="1236" y="276" class="small">generate</text>
 <path d="M483 424H549" class="line"/>
 <text x="516" y="410" class="small center">state</text>
 <path d="M951 424H1017" class="line"/>
 <text x="984" y="410" class="small center">weights</text>
 <path d="M1017 612H951" class="line"/>
 <text x="984" y="642" class="small center">responses</text>

 <!-- storage + monitor -->
 <rect x="78" y="739" width="405" height="78" fill="#b9b7ff" stroke="#111" stroke-width="4"/>
 <text x="281" y="773" class="box center">Checkpoint / State Store</text><text x="281" y="799" class="small center">HF model · optimizer checkpoint</text>
 <path d="M281 692V739" class="bi"/>

 <rect x="549" y="739" width="402" height="78" fill="#73ecee" stroke="#111" stroke-width="4"/>
 <text x="750" y="773" class="box center">CPU ↔ GPU Transfer Tracker</text><text x="750" y="799" class="small center">direction · bytes · latency · bandwidth</text>
 <path d="M750 672V739" class="line"/>

 <rect x="1017" y="739" width="405" height="78" fill="#ffe08a" stroke="#111" stroke-width="4"/>
 <text x="1220" y="773" class="box center">Memory &amp; Performance Monitor</text><text x="1220" y="799" class="small center">GPU peak · CPU RSS · step time · OOM</text>
 <path d="M951 778H1017" class="line"/>

 <!-- responsibility labels -->
 <rect x="101" y="292" width="250" height="35" fill="#ff4d57"/><text x="226" y="316" class="small center" style="fill:white">TRAINING RESPONSIBILITY</text>
 <rect x="1073" y="292" width="294" height="35" fill="#ff4d57"/><text x="1220" y="316" class="small center" style="fill:white">INFERENCE RESPONSIBILITY</text>
</svg>
