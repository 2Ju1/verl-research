<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#176b87"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#101827}.sub{font:500 16px Arial,sans-serif;fill:#475569}.h{font:700 24px Arial,sans-serif;fill:#111827}.mh{font:700 20px Arial,sans-serif;fill:#111827}.body{font:500 16px Arial,sans-serif;fill:#334155}.small{font:500 14px Arial,sans-serif;fill:#475569}.tiny{font:600 12px Arial,sans-serif;fill:#64748b}.chip{font:700 15px Arial,sans-serif}.num{font:700 18px Arial,sans-serif;fill:white;text-anchor:middle;dominant-baseline:middle}.center{text-anchor:middle}.line{stroke:#176b87;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="62" y="66" class="title">Phase-Aware CPU–GPU Offloading for VERL GRPO Training</text>
  <text x="62" y="96" class="sub">End-to-end experiment design · Qwen2.5-0.5B-Instruct · GSM8K · FSDP / vLLM</text>

  <!-- Experiment controller -->
  <rect x="58" y="128" width="1484" height="92" rx="18" fill="#f8fafc" stroke="#93c5fd" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="86" y="162" class="mh">Experiment Matrix Controller</text>
  <g transform="translate(86 178)">
    <rect width="178" height="28" rx="14" fill="#e0f2fe"/><text x="89" y="19" class="chip center" fill="#0369a1">Actor parameters</text>
    <rect x="190" width="188" height="28" rx="14" fill="#ede9fe"/><text x="284" y="19" class="chip center" fill="#6d28d9">Reference parameters</text>
    <rect x="390" width="182" height="28" rx="14" fill="#ffedd5"/><text x="481" y="19" class="chip center" fill="#c2410c">Optimizer state</text>
    <rect x="584" width="176" height="28" rx="14" fill="#dcfce7"/><text x="672" y="19" class="chip center" fill="#15803d">Saved activations</text>
    <rect x="772" width="214" height="28" rx="14" fill="#f1f5f9"/><text x="879" y="19" class="chip center" fill="#334155">Residency / retention</text>
    <text x="1010" y="19" class="small">→ repeated runs + warm-up exclusion</text>
  </g>

  <!-- numbered flow -->
  <g><circle cx="116" cy="270" r="22" fill="#111827"/><text x="116" y="270" class="num">1</text></g>
  <g><circle cx="405" cy="270" r="22" fill="#111827"/><text x="405" y="270" class="num">2</text></g>
  <g><circle cx="710" cy="270" r="22" fill="#111827"/><text x="710" y="270" class="num">3</text></g>
  <g><circle cx="1010" cy="270" r="22" fill="#111827"/><text x="1010" y="270" class="num">4</text></g>
  <g><circle cx="1305" cy="270" r="22" fill="#111827"/><text x="1305" y="270" class="num">5</text></g>

  <!-- Main cards -->
  <g filter="url(#shadow)">
    <rect x="58" y="305" width="238" height="360" rx="20" fill="#fff" stroke="#fda4af" stroke-width="2"/>
    <rect x="329" y="305" width="270" height="360" rx="20" fill="#fff" stroke="#86efac" stroke-width="2"/>
    <rect x="632" y="305" width="270" height="360" rx="20" fill="#fff" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="935" y="305" width="270" height="360" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="1238" y="305" width="304" height="360" rx="20" fill="#fff" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- data -->
  <text x="177" y="350" class="h center">Training Input</text>
  <rect x="84" y="377" width="186" height="48" rx="12" fill="#fff1f2"/><text x="177" y="407" class="mh center" fill="#e11d48">GSM8K prompts</text>
  <g fill="#fecdd3" stroke="#fb7185"><rect x="84" y="448" width="48" height="30" rx="7"/><rect x="140" y="448" width="48" height="30" rx="7"/><rect x="196" y="448" width="48" height="30" rx="7"/><rect x="84" y="488" width="48" height="30" rx="7"/><rect x="140" y="488" width="48" height="30" rx="7"/><rect x="196" y="488" width="48" height="30" rx="7"/></g>
  <text x="177" y="550" class="body center">Question + ground truth</text><text x="177" y="579" class="small center">batched sampling</text>
  <rect x="88" y="604" width="178" height="34" rx="17" fill="#f8fafc"/><text x="177" y="626" class="small center">max prompt / response length</text>

  <!-- phases -->
  <text x="464" y="350" class="h center">GRPO Step</text>
  <g>
    <rect x="357" y="375" width="214" height="48" rx="12" fill="#ecfdf5"/><text x="380" y="405" class="mh" fill="#047857">A</text><text x="414" y="405" class="body">Rollout (vLLM)</text>
    <rect x="357" y="435" width="214" height="48" rx="12" fill="#ecfdf5"/><text x="380" y="465" class="mh" fill="#047857">B</text><text x="414" y="465" class="body">Actor log-prob</text>
    <rect x="357" y="495" width="214" height="48" rx="12" fill="#f5f3ff"/><text x="380" y="525" class="mh" fill="#7c3aed">C</text><text x="414" y="525" class="body">Reference log-prob</text>
    <rect x="357" y="555" width="214" height="48" rx="12" fill="#fff7ed"/><text x="380" y="585" class="mh" fill="#c2410c">D</text><text x="414" y="585" class="body">Actor update</text>
  </g>
  <text x="464" y="630" class="small center">phase boundaries trigger state moves</text>

  <!-- residency -->
  <text x="767" y="350" class="h center">Residency Policy</text>
  <rect x="660" y="378" width="214" height="105" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="682" y="407" class="mh" fill="#1d4ed8">GPU resident</text>
  <text x="682" y="436" class="body">• active phase state</text><text x="682" y="463" class="body">• optional Actor retention</text>
  <rect x="660" y="502" width="214" height="105" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="682" y="531" class="mh" fill="#475569">CPU offload</text>
  <text x="682" y="560" class="body">• inactive model state</text><text x="682" y="587" class="body">• activations / optimizer</text>
  <path d="M850 490 C900 480 900 610 850 620" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <path d="M684 620 C625 610 625 485 684 490" stroke="#176b87" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="767" y="640" class="tiny center">CPU ↔ GPU transfers</text>

  <!-- state objects -->
  <text x="1070" y="350" class="h center">Offloaded Objects</text>
  <g class="body">
    <rect x="965" y="378" width="210" height="44" rx="10" fill="#e0f2fe"/><circle cx="990" cy="400" r="8" fill="#0284c7"/><text x="1010" y="406">Actor parameters</text>
    <rect x="965" y="433" width="210" height="44" rx="10" fill="#ede9fe"/><circle cx="990" cy="455" r="8" fill="#7c3aed"/><text x="1010" y="461">Reference parameters</text>
    <rect x="965" y="488" width="210" height="44" rx="10" fill="#ffedd5"/><circle cx="990" cy="510" r="8" fill="#ea580c"/><text x="1010" y="516">AdamW state</text>
    <rect x="965" y="543" width="210" height="44" rx="10" fill="#dcfce7"/><circle cx="990" cy="565" r="8" fill="#16a34a"/><text x="1010" y="571">Saved activations</text>
  </g>
  <rect x="970" y="606" width="200" height="32" rx="16" fill="#f1f5f9"/><text x="1070" y="627" class="small center">CPU AdamW or GPU AdamW</text>

  <!-- measures -->
  <text x="1390" y="350" class="h center">Instrumentation</text>
  <g class="body">
    <path d="M1280 398 h32 l12-20 18 42 15-28 14 6 h126" stroke="#f59e0b" stroke-width="4" fill="none"/>
    <text x="1280" y="456">GPU allocated / reserved</text>
    <text x="1280" y="489">GPU device memory</text>
    <text x="1280" y="522">CPU RSS / system memory</text>
    <text x="1280" y="555">Phase latency &amp; step time</text>
    <text x="1280" y="588">Transfer time / bandwidth</text>
  </g>
  <rect x="1280" y="608" width="220" height="32" rx="16" fill="#fef3c7"/><text x="1390" y="629" class="small center" fill="#92400e">OOM / feasibility detection</text>

  <!-- arrows -->
  <path d="M296 485 H329" class="line"/><path d="M599 485 H632" class="line"/><path d="M902 485 H935" class="line"/><path d="M1205 485 H1238" class="line"/>

  <!-- outcomes -->
  <rect x="58" y="708" width="1484" height="142" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="86" y="747" class="mh">Configuration-level comparison</text>
  <g>
    <rect x="86" y="770" width="255" height="52" rx="12" fill="#fff" stroke="#93c5fd"/><text x="214" y="792" class="chip center" fill="#1d4ed8">Peak GPU memory</text><text x="214" y="813" class="tiny center">overall + per phase</text>
    <rect x="361" y="770" width="255" height="52" rx="12" fill="#fff" stroke="#86efac"/><text x="489" y="792" class="chip center" fill="#15803d">End-to-end throughput</text><text x="489" y="813" class="tiny center">step time / samples</text>
    <rect x="636" y="770" width="255" height="52" rx="12" fill="#fff" stroke="#c4b5fd"/><text x="764" y="792" class="chip center" fill="#6d28d9">Transfer overhead</text><text x="764" y="813" class="tiny center">bytes · time · bandwidth</text>
    <rect x="911" y="770" width="255" height="52" rx="12" fill="#fff" stroke="#fdba74"/><text x="1039" y="792" class="chip center" fill="#c2410c">Training correctness</text><text x="1039" y="813" class="tiny center">loss / reward / update</text>
    <rect x="1186" y="770" width="320" height="52" rx="12" fill="#111827"/><text x="1346" y="793" class="chip center" fill="#fff">Memory–performance Pareto frontier</text><text x="1346" y="814" class="tiny center" fill="#cbd5e1">select the best residency policy</text>
  </g>
</svg>
